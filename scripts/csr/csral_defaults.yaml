#
# CSRAL policy defaults (docs/csral_plan.md §4.3). Merged by csr_param_gen.py
# with the project's `csral:` section in project_override.yaml (project wins
# per key/pattern). Save/restore enablement has NO YAML knob — it is
# runtime-only via +csral_save_restore (default misa.H).
#
# Names match the lowercased spec key; globs are full-name anchored fnmatch,
# NOT substrings. Unknown names here only warn (these defaults are shared
# across projects with different CSR sets); unknown names in a project's own
# csral: section are generation errors.

compare_mask_source: whisper
reset_check: error

# Shifted field views that ALIAS_OF cannot express.
field_aliases:
  - {csr: fcsr, bits: "4:0", alias_of: fflags, alias_bits: "4:0"}
  - {csr: fcsr, bits: "7:5", alias_of: frm, alias_bits: "2:0"}

# Exact-name/glob expansion of the legacy cosim_resynch_csr_defaults
# substring list (bridge.cpp:147-211), verified 2026-08-24 against both
# rv_tester's csr_spec.yaml and riscv_cluster's csrs.yml (every exact name
# exists in both; every glob matches in both). Trailing comments name the
# legacy token each entry came from. Dead tokens dropped: mcontext,
# minstreth (no such CSR in either spec), pma (spec-B-only; see note below).
policies:
  default: {check: true, on_mismatch: error}
  # misa's reset value encodes which extensions a core's whisper config
  # enables — inherently per-core, so the shared default spec cannot pin it.
  # Runtime misa checking is unaffected. A project whose spec and whisper
  # config are both its own should re-enable this in its csral: section.
  misa: {check_reset: false}
  "c_*": {check: false} # generator default: cac_check=false for c_*

  # --- status family ---
  sstatus: {on_mismatch: skip} # token "sstatus"
  vsstatus: {on_mismatch: skip, exists_if: misa.H} # token "sstatus" (substring; now explicit) + hypervisor_csr_map_
  mstatus: {on_mismatch: skip} # token "mstatus"
  hstatus: {on_mismatch: skip, exists_if: misa.H} # token "hstatus" + hypervisor_csr_map_

  # --- interrupt enables (RVDE-11840) ---
  mie: {on_mismatch: skip} # token "mie"
  hie: {on_mismatch: skip, exists_if: misa.H} # token "hie" + hypervisor_csr_map_
  sie: {on_mismatch: skip} # token "sie"
  vsie: {on_mismatch: skip, exists_if: misa.H} # token "vsie" + hypervisor_csr_map_

  # --- vector (RVDE-17338; vtype permanent) ---
  vxsat: {on_mismatch: skip} # token "vxsat"
  vcsr: {on_mismatch: skip} # token "vcsr"
  vxrm: {on_mismatch: skip} # token "vxrm"
  vtype: {on_mismatch: skip} # token "vtype"

  # --- misc config ---
  srmcfg: {on_mismatch: skip} # token "srmcfg"
  menvcfg: {on_mismatch: skip} # token "menvcfg"
  senvcfg: {on_mismatch: skip} # token "senvcfg"
  henvcfg: {on_mismatch: skip, exists_if: misa.H} # token "henvcfg" + hypervisor_csr_map_

  # --- triggers (Sdtrig; tinfo RVDE-7518/RVTOOLS-3124) ---
  tselect: {on_mismatch: skip} # token "tselect"
  tdata1: {on_mismatch: skip} # token "tdata1"
  tdata2: {on_mismatch: skip} # token "tdata2"
  tdata3: {on_mismatch: skip} # token "tdata3"
  tinfo: {on_mismatch: skip} # token "tinfo"

  # --- floating point ---
  fflags: {on_mismatch: skip} # token "fflags"
  fcsr: {on_mismatch: skip} # token "fcsr" (unimplemented)

  # --- PMP (FIXME: Performant NC change) ---
  "pmpaddr*": {on_mismatch: skip} # token "pmp"
  "pmpcfg*": {on_mismatch: skip} # token "pmp"
  # token "pma" is dead here; in riscv_cluster it only bites c_pmacfg0..15
  # (re-enabled by its cac_check_overrides), so the skip belongs in that
  # project's own csral: section as "c_pmacfg*": {check: true, on_mismatch: skip}.

  # --- interrupt-pending set (interrupt_csrs_to_resynch_, bridge.h:319) ---
  mip: {class: interrupt, volatile: true, on_mismatch: resynch_rd} # token "mip"
  sip: {class: interrupt, volatile: true, on_mismatch: resynch_rd} # token "sip"
  hip: {class: interrupt, volatile: true, on_mismatch: resynch_rd, exists_if: misa.H} # token "hip" + hypervisor_csr_map_
  vsip: {class: interrupt, volatile: true, on_mismatch: resynch_rd, exists_if: misa.H} # token "vsip" + hypervisor_csr_map_
  hgeip: {class: interrupt, volatile: true, on_mismatch: resynch_rd, exists_if: misa.H} # token "hgeip" + hypervisor_csr_map_
  mtopi: {class: interrupt, volatile: true, on_mismatch: resynch_rd} # token "mtopi"
  stopi: {class: interrupt, volatile: true, on_mismatch: resynch_rd} # token "stopi"
  vstopi: {class: interrupt, volatile: true, on_mismatch: resynch_rd, exists_if: misa.H} # token "vstopi" (RVTOOLS-3189) + hypervisor_csr_map_

  # --- other interrupt CSRs (skip only, not in the resynch set) ---
  mvip: {volatile: true, on_mismatch: skip} # token "mvip" (paired with mip pokes; mirror can be stale)
  hvip: {on_mismatch: skip, exists_if: misa.H} # token "hvip" + hypervisor_csr_map_
  hviprio1: {on_mismatch: skip, exists_if: misa.H} # token "hvip" (substring accident, kept for parity — REVIEW) + hypervisor_csr_map_
  hviprio2: {on_mismatch: skip, exists_if: misa.H} # token "hvip" (substring accident, kept for parity — REVIEW) + hypervisor_csr_map_

  # --- AIA indirect access (Smcsrind adds *ireg2..6 in some specs) ---
  "mireg*": {on_mismatch: skip} # token "mireg"
  "sireg*": {on_mismatch: skip} # token "sireg"
  "vsireg*": {on_mismatch: skip} # token "vsireg"

  # --- IMSIC top external interrupt (permanent: interrupts) ---
  mtopei: {on_mismatch: skip} # token "mtopei"
  stopei: {on_mismatch: skip} # token "stopei"
  vstopei: {on_mismatch: skip, may_not_exist: true, exists_if: misa.H} # token "vstopei" + MayPeekCSR_map_ + hypervisor_csr_map_

  # --- performance counters (permanent: PMC events) ---
  "hpmcounter*": {on_mismatch: skip} # token "hpmcounter"
  "mhpmcounter*": {on_mismatch: skip} # token "hpmcounter" (family intent, now explicit)
  mcycle: {on_mismatch: skip} # token "mcycle"
  minstret: {on_mismatch: skip} # token "minstret"
  "mhpmevent*": {on_mismatch: skip} # token "mhpmevent" (RVDE-22160, OF bit)
  scountovf: {on_mismatch: skip} # token "scountovf"

  # --- debug (permanent: debug events) ---
  dcsr: {on_mismatch: skip} # token "dcsr"
  dpc: {on_mismatch: skip} # token "dpc"
  dscratch0: {on_mismatch: skip} # token "dscratch0"
  dscratch1: {on_mismatch: skip} # token "dscratch1"

  # --- Smstateen ---
  sstateen0: {on_mismatch: skip} # token "sstateen0"
  sstateen1: {on_mismatch: skip} # token "sstateen1"
  sstateen2: {on_mismatch: skip} # token "sstateen2"
  sstateen3: {on_mismatch: skip} # token "sstateen3"
  hstateen0: {on_mismatch: skip} # token "hstateen0"
  hstateen1: {on_mismatch: skip} # token "hstateen1"
  hstateen2: {on_mismatch: skip} # token "hstateen2"
  hstateen3: {on_mismatch: skip} # token "hstateen3"

  # --- entropy ---
  seed: {volatile: true, on_mismatch: skip} # token "seed"

  # --- hypervisor CSR existence gating (bridge.h hypervisor_csr_map_) ---
  # While misa.H is 0 these CSRs do not exist: no mirror updates, no checks,
  # no whisper mask peeks. Field-level H masking on mstatus/medeleg/mideleg/
  # mip/mie comes from the spec's MASKED_BY; this is the whole-CSR gate.
  hedeleg: {exists_if: misa.H}
  hideleg: {exists_if: misa.H}
  htimedelta: {exists_if: misa.H}
  hcounteren: {exists_if: misa.H}
  hgeie: {exists_if: misa.H}
  hvictl: {exists_if: misa.H}
  htval: {exists_if: misa.H}
  hgatp: {exists_if: misa.H}
  htinst: {exists_if: misa.H}
  mtval2: {exists_if: misa.H}
  mtinst: {exists_if: misa.H}
  vstvec: {exists_if: misa.H}
  vsscratch: {exists_if: misa.H}
  vsepc: {exists_if: misa.H}
  vscause: {exists_if: misa.H}
  vstval: {exists_if: misa.H}
  vstimecmp: {exists_if: misa.H}
  vsatp: {exists_if: misa.H}
  hvien: {exists_if: misa.H}
