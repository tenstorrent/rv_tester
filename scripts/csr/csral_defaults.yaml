#
# CSRAL policy defaults, merged with the project's `csral:` section (project wins).
# Names are exact or full-name fnmatch globs, never substrings; unknown names
# here warn, unknown names in a project's csral: section are generation errors.
# See the CSRAL section of docs/source/user_guides/cosim.rst.

compare_mask_source: whisper
reset_check: error

# Shifted field views that ALIAS_OF cannot express.
field_aliases:
  - {csr: fcsr, bits: "4:0", alias_of: fflags, alias_bits: "4:0"}
  - {csr: fcsr, bits: "7:5", alias_of: frm, alias_bits: "2:0"}

# Exact-name expansion of the legacy cosim_resynch_csr_defaults substring list.
policies:
  default: {check: true, on_mismatch: error}
  # misa's reset encodes per-core whisper config; projects may re-enable.
  misa: {check_reset: false}
  "c_*": {check: false}

  # status family
  sstatus: {on_mismatch: skip}
  vsstatus: {on_mismatch: skip, exists_if: misa.H}
  mstatus: {on_mismatch: skip}
  hstatus: {on_mismatch: skip, exists_if: misa.H}

  # interrupt enables
  mie: {on_mismatch: skip}
  hie: {on_mismatch: skip, exists_if: misa.H}
  sie: {on_mismatch: skip}
  vsie: {on_mismatch: skip, exists_if: misa.H}

  # vector
  vxsat: {on_mismatch: skip}
  vcsr: {on_mismatch: skip}
  vxrm: {on_mismatch: skip}
  vtype: {on_mismatch: skip}

  # misc config
  srmcfg: {on_mismatch: skip}
  menvcfg: {on_mismatch: skip}
  senvcfg: {on_mismatch: skip}
  henvcfg: {on_mismatch: skip, exists_if: misa.H}

  # triggers
  tselect: {on_mismatch: skip}
  tdata1: {on_mismatch: skip}
  tdata2: {on_mismatch: skip}
  tdata3: {on_mismatch: skip}
  tinfo: {on_mismatch: skip}

  # floating point
  fflags: {on_mismatch: skip}
  fcsr: {on_mismatch: skip}

  # PMP
  "pmpaddr*": {on_mismatch: skip}
  "pmpcfg*": {on_mismatch: skip}

  # interrupt-pending set (resynched on mismatch)
  mip: {class: interrupt, volatile: true, on_mismatch: resynch_rd}
  sip: {class: interrupt, volatile: true, on_mismatch: resynch_rd}
  hip: {class: interrupt, volatile: true, on_mismatch: resynch_rd, exists_if: misa.H}
  vsip: {class: interrupt, volatile: true, on_mismatch: resynch_rd, exists_if: misa.H}
  hgeip: {class: interrupt, volatile: true, on_mismatch: resynch_rd, exists_if: misa.H}
  mtopi: {class: interrupt, volatile: true, on_mismatch: resynch_rd}
  stopi: {class: interrupt, volatile: true, on_mismatch: resynch_rd}
  vstopi: {class: interrupt, volatile: true, on_mismatch: resynch_rd, exists_if: misa.H}

  # other interrupt CSRs (skip only)
  mvip: {volatile: true, on_mismatch: skip}
  hvip: {on_mismatch: skip, exists_if: misa.H}
  hviprio1: {on_mismatch: skip, exists_if: misa.H} # legacy "hvip" substring match, kept for parity
  hviprio2: {on_mismatch: skip, exists_if: misa.H} # legacy "hvip" substring match, kept for parity

  # AIA indirect access
  "mireg*": {on_mismatch: skip}
  "sireg*": {on_mismatch: skip}
  "vsireg*": {on_mismatch: skip}

  # IMSIC top external interrupt
  mtopei: {on_mismatch: skip}
  stopei: {on_mismatch: skip}
  vstopei: {on_mismatch: skip, may_not_exist: true, exists_if: misa.H}

  # performance counters
  "hpmcounter*": {on_mismatch: skip}
  "mhpmcounter*": {on_mismatch: skip}
  mcycle: {on_mismatch: skip}
  minstret: {on_mismatch: skip}
  "mhpmevent*": {on_mismatch: skip}
  scountovf: {on_mismatch: skip}

  # debug
  dcsr: {on_mismatch: skip}
  dpc: {on_mismatch: skip}
  dscratch0: {on_mismatch: skip}
  dscratch1: {on_mismatch: skip}

  # Smstateen
  sstateen0: {on_mismatch: skip}
  sstateen1: {on_mismatch: skip}
  sstateen2: {on_mismatch: skip}
  sstateen3: {on_mismatch: skip}
  hstateen0: {on_mismatch: skip}
  hstateen1: {on_mismatch: skip}
  hstateen2: {on_mismatch: skip}
  hstateen3: {on_mismatch: skip}

  # entropy
  seed: {volatile: true, on_mismatch: skip}

  # whole-CSR hypervisor existence gates (field-level H masking comes from MASKED_BY)
  hedeleg: {exists_if: misa.H}
  hideleg: {exists_if: misa.H}
  htimedelta: {exists_if: misa.H}
  hcounteren: {exists_if: misa.H}
  hgeie: {exists_if: misa.H}
  hvictl: {exists_if: misa.H}
  htval: {exists_if: misa.H}
  hgatp: {exists_if: misa.H}
  htinst: {exists_if: misa.H}
  mtval2: {exists_if: misa.H}
  mtinst: {exists_if: misa.H}
  vstvec: {exists_if: misa.H}
  vsscratch: {exists_if: misa.H}
  vsepc: {exists_if: misa.H}
  vscause: {exists_if: misa.H}
  vstval: {exists_if: misa.H}
  vstimecmp: {exists_if: misa.H}
  vsatp: {exists_if: misa.H}
  hvien: {exists_if: misa.H}
