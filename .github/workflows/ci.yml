name: CI

on:
  push:
    branches:
      - master
      - "ascalon/**"
  pull_request:

env:
  BAZEL_OPTS: "--jobs=8"
  BAZEL_DISK_CACHE: bazel_disk_cache
  BAZEL_DISK_CACHE_MARKER: bazel_disk_cache.marker

jobs:
  build:
    # Builds every test target in the plain configuration into the disk cache:
    # the Verilator tool, the verilated models and the testbench binaries. The
    # smoke/valgrind/lint jobs then only run tests; asan/tsan reuse the
    # configuration-independent entries.
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/tenstorrent/cvm:0.1.5
    timeout-minutes: 90
    outputs:
      cache-key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute cache key
        id: key
        run: |
          echo "key=bazel-disk-cache-plain-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
          touch "$BAZEL_DISK_CACHE_MARKER"
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.BAZEL_DISK_CACHE }}
          key: ${{ steps.key.outputs.key }}
          restore-keys: bazel-disk-cache-plain-
      - name: Build all test targets into the disk cache
        run: bazel-7 --output_user_root=./bazel_output_user_root build --config=bzlmod --build_tests_only --disk_cache=./$BAZEL_DISK_CACHE $BAZEL_OPTS //test/...
      - name: Drop cache entries this build did not use
        run: find "$BAZEL_DISK_CACHE" -type f ! -newer "$BAZEL_DISK_CACHE_MARKER" -delete
      - uses: actions/cache/save@v4
        with:
          path: ${{ env.BAZEL_DISK_CACHE }}
          key: ${{ steps.key.outputs.key }}

  lint:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/tenstorrent/cvm:0.1.5
    timeout-minutes: 60
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.BAZEL_DISK_CACHE }}
          key: ${{ needs.build.outputs.cache-key }}
          fail-on-cache-miss: true
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Static checks
        run: |
          (! git grep DECLARE_ -- '**.c' '**.cpp') || (echo "Error - DECLARE statements must be in header files"; exit 1)
          python3 scripts/plusarg_lint.py
          git ls-files '*.cpp' '*.cc' '*.h' '*.hpp' | xargs clang-format --Werror --dry-run --verbose
      - name: clang-tidy
        run: bazel-7 --output_user_root=./bazel_output_user_root build //test/sw_testbench/verilator:sw_2c_tb_verilator --config=bzlmod --config=clang-tidy --disk_cache=./$BAZEL_DISK_CACHE $BAZEL_OPTS

  build-bazel6-top:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/tenstorrent/cvm:0.1.5
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Bazel 6 WORKSPACE build
        run: bazel --output_user_root=./bazel_output_user_root_b6 build //src:all //test/sw_testbench:sw_1c_rv_tester_sv //test/sw_testbench:sw_2c_rv_tester_sv $BAZEL_OPTS

  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/tenstorrent/cvm:0.1.5
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: smoke
            targets: "//test/..."
            flags: ""
            cache: plain
          - name: asan+ubsan
            targets: "-- //test/... -//test/examples/..."
            flags: "--config=asan --config=ubsan --test_tag_filters=-no-sanitizer"
            cache: asan
          - name: tsan
            targets: "-- //test/... -//test/examples/..."
            flags: "--features=tsan --test_tag_filters=-no-sanitizer"
            cache: tsan
          - name: valgrind
            targets: "-- //test/... -//test/examples/..."
            flags: "--test_env=SIM_WRAP='valgrind --tool=memcheck --leak-check=full --track-origins=yes --error-exitcode=1' --test_tag_filters=-no-valgrind"
            cache: plain
    name: test (${{ matrix.name }})
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Compute cache key
        id: key
        run: |
          echo "key=bazel-disk-cache-${{ matrix.cache }}-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
          touch "$BAZEL_DISK_CACHE_MARKER"
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.BAZEL_DISK_CACHE }}
          key: ${{ steps.key.outputs.key }}
          restore-keys: |
            bazel-disk-cache-${{ matrix.cache }}-
            ${{ needs.build.outputs.cache-key }}
          fail-on-cache-miss: true
      - name: bazel test //test/...
        run: bazel-7 --output_user_root=./bazel_output_user_root test --config=bzlmod --build_tests_only ${{ matrix.flags }} --disk_cache=./$BAZEL_DISK_CACHE --test_output=errors $BAZEL_OPTS ${{ matrix.targets }}
      - name: Drop cache entries this build did not use
        if: matrix.cache != 'plain'
        run: find "$BAZEL_DISK_CACHE" -type f ! -newer "$BAZEL_DISK_CACHE_MARKER" -delete
      - uses: actions/cache/save@v4
        if: matrix.cache != 'plain'
        with:
          path: ${{ env.BAZEL_DISK_CACHE }}
          key: ${{ steps.key.outputs.key }}
