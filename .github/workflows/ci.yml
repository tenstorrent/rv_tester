name: CI

on:
  push:
    branches:
      - master
      - "ascalon/**"
  pull_request:

env:
  BAZEL_OPTS: "--jobs=8"
  BAZEL_DISK_CACHE_MARKER: bazel_disk_cache.marker
  BAZEL_CACHE_FILES: '["MODULE.bazel", ".bazelrc", "bazel/**", "src/**", "test/**"]'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/tenstorrent/cvm:0.1.5
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: touch "$BAZEL_DISK_CACHE_MARKER"
      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          cache-version: ${{ hashFiles('.github/workflows/ci.yml') }}
          disk-cache: plain
          repository-cache: ${{ env.BAZEL_CACHE_FILES }}
          external-cache: true
      - name: Build all test targets into the disk cache
        run: bazel-7 build --config=bzlmod --build_tests_only $BAZEL_OPTS //test/...
      - name: Drop cache entries this build did not use
        if: always()
        run: find "$HOME/.cache/bazel-disk" -type f ! -newer "$BAZEL_DISK_CACHE_MARKER" -delete

  lint:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/tenstorrent/cvm:0.1.5
    timeout-minutes: 60
    needs: build
    steps:
      - uses: actions/checkout@v4
      - run: touch "$BAZEL_DISK_CACHE_MARKER"
      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          cache-version: ${{ hashFiles('.github/workflows/ci.yml') }}
          disk-cache: plain
          repository-cache: ${{ env.BAZEL_CACHE_FILES }}
          external-cache: true
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Static checks
        run: |
          (! git grep DECLARE_ -- '**.c' '**.cpp') || (echo "Error - DECLARE statements must be in header files"; exit 1)
          python3 scripts/plusarg_lint.py
          git ls-files '*.cpp' '*.cc' '*.h' '*.hpp' | xargs clang-format --Werror --dry-run --verbose
      - name: clang-tidy
        run: bazel-7 build //test/sw_testbench/verilator:sw_2c_tb_verilator --config=bzlmod --config=clang-tidy $BAZEL_OPTS
      - name: Drop cache entries this build did not use
        if: always()
        run: find "$HOME/.cache/bazel-disk" -type f ! -newer "$BAZEL_DISK_CACHE_MARKER" -delete

  build-bazel6-top:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/tenstorrent/cvm:0.1.5
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Bazel 6 WORKSPACE build
        run: bazel --output_user_root=./bazel_output_user_root_b6 build //src:all //test/sw_testbench:sw_1c_rv_tester_sv //test/sw_testbench:sw_2c_rv_tester_sv $BAZEL_OPTS

  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/tenstorrent/cvm:0.1.5
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: smoke
            targets: "//test/..."
            flags: ""
            cache: plain
          - name: asan+ubsan
            targets: "-- //test/... -//test/examples/..."
            flags: "--config=asan --config=ubsan --test_tag_filters=-no-sanitizer"
            cache: asan
          - name: tsan
            targets: "-- //test/... -//test/examples/..."
            flags: "--features=tsan --test_tag_filters=-no-sanitizer"
            cache: tsan
          - name: valgrind
            targets: "-- //test/... -//test/examples/..."
            flags: "--test_env=SIM_WRAP='valgrind --tool=memcheck --leak-check=full --track-origins=yes --error-exitcode=1' --test_tag_filters=-no-valgrind"
            cache: plain
    name: test (${{ matrix.name }})
    needs: build
    steps:
      - uses: actions/checkout@v4
      - run: touch "$BAZEL_DISK_CACHE_MARKER"
      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          cache-version: ${{ hashFiles('.github/workflows/ci.yml') }}
          disk-cache: ${{ matrix.cache }}
          repository-cache: ${{ env.BAZEL_CACHE_FILES }}
          external-cache: true
      - name: bazel test //test/...
        run: bazel-7 test --config=bzlmod --build_tests_only --nocache_test_results ${{ matrix.flags }} --test_output=errors $BAZEL_OPTS ${{ matrix.targets }}
      - name: Drop cache entries this build did not use
        if: always()
        run: find "$HOME/.cache/bazel-disk" -type f ! -newer "$BAZEL_DISK_CACHE_MARKER" -delete
