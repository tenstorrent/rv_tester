# Builds the Sphinx documentation in docs/ and publishes it to GitHub Pages at
# https://docs.tenstorrent.com/rv_tester/. Pull requests build with warnings as
# errors but do not deploy.
name: Docs

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install doc dependencies
        run: pip install -r docs/requirements.txt

      - name: Build docs
        run: python3 docs/build.py --clean --check --build_dir docs/_build

      # Belt and braces: the Pages artifact path skips Jekyll, but this also
      # protects the _static/ and _sources/ directories if the site is ever
      # served from a branch again.
      - name: Disable Jekyll processing
        run: touch docs/_build/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
